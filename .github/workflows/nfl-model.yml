name: NFL model

on:
  schedule:
    - cron: "0 12 * * 1,2,5"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install nflreadpy pandas pyarrow scikit-learn requests
      - name: Train and upload
        env:
          BOARD_URL: ${{ secrets.BOARD_URL }}
          MODEL_SECRET: ${{ secrets.MODEL_SECRET }}
        run: python model/nfl_model.py
