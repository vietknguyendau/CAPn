name: Capture lines

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "15 17 * * 0"
    - cron: "45 23 * * 0"
    - cron: "30 23 * * 1,4"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture
        env:
          BOARD_URL: ${{ secrets.BOARD_URL }}
          MODEL_SECRET: ${{ secrets.MODEL_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "30 1 * * *") sports="nba" ;;
            "") sports="nba nfl" ;;
            *) sports="nfl" ;;
          esac
          for s in $sports; do
            echo "Capturing $s"
            curl -fsS -H "Authorization: Bearer $MODEL_SECRET" "${BOARD_URL%/}/api/capture?sport=$s"
            echo
          done
